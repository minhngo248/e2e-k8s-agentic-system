apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: atenet-router-backend
  namespace: kagent
spec:
  static:
    host: atenet-router.ate-system.svc.cluster.local
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-scale-route
  namespace: kagent
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /no-scale
          headers:
            - name: Agent
              value: hello1
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello1.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /no-scale
          headers:
            - name: Agent
              value: hello2
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello2.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /no-scale
          headers:
            - name: Agent
              value: hello3
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello3.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /no-scale
          headers:
            - name: Agent
              value: hello4
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello4.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend