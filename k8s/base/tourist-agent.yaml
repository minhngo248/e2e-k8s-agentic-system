apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: tourist-agent
  namespace: default
spec:
  type: BYO

  byo:
    deployment:
      image: ghcr.io/minhngo248/touristagent:0.0.1-SNAPSHOT
      args: ["--spring.profiles.active=prod"]
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent
              key: OPENAI_API_KEY
        - name: TOURIST_API_URL
          valueFrom:
            secretKeyRef:
              name: agent
              key: TOURIST_API_URL