apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scale-route
  namespace: kagent
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /scale
          headers:
            - name: Agent
              value: hello11
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello11.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /scale
          headers:
            - name: Agent
              value: hello12
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hello12.ate-golden.actors.resources.substrate.ate.dev
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: atenet-router-backend
          group: agentgateway.dev
          kind: AgentgatewayBackend